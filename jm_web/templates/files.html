{% extends "base.html" %}
{% block title %}文件浏览 — JM Downloader{% endblock %}
{% block page_class %}files{% endblock %}
{% block content %}

<div class="row">
    <!-- 左侧：文件树 -->
    <div class="col-lg-8">
        <div class="page-header" style="margin-bottom:1rem">
            <div class="page-header-accent" style="background:linear-gradient(180deg,#f59e0b,#ef4444)"></div>
            <h2 style="font-size:1.15rem"><i class="bi bi-folder2-open me-1" style="color:#f59e0b"></i>文件浏览器</h2>
            <button class="btn btn-outline-info btn-sm ms-auto" onclick="htmx.trigger('#file-tree','reload')" style="margin-left:auto">
                <i class="bi bi-arrow-clockwise me-1"></i>刷新
            </button>
        </div>
        <div class="jm-card">
            <div class="jm-card-body" style="padding:.6rem">
                <div id="file-tree" hx-get="/files/browse" hx-trigger="load, reload from:body" hx-swap="innerHTML">
                    <div class="empty-state"><div class="spinner-border spinner-border-sm" style="color:var(--fg-muted)"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧：工具栏 -->
    <div class="col-lg-4 mt-3 mt-lg-0">
        <!-- 导出 -->
        <div class="jm-card" style="margin-bottom:1rem" x-data="exportPanel()">
            <div class="jm-card-header">
                <span class="jm-card-title"><i class="bi bi-file-earmark-arrow-up" style="color:var(--warning)"></i> 导出工具</span>
            </div>
            <div class="jm-card-body">
                <div style="margin-bottom:.65rem">
                    <label class="form-label">目标路径（相对于下载目录）</label>
                    <input type="text" class="form-control form-control-sm" placeholder="例如: JM12345" x-model="exportPath">
                </div>
                <div style="display:flex;gap:.35rem;flex-wrap:wrap">
                    <button class="btn btn-outline-danger btn-sm" @click="doExport('pdf')" :disabled="exporting"><i class="bi bi-file-pdf me-1"></i>PDF</button>
                    <button class="btn btn-outline-warning btn-sm" @click="doExport('zip')" :disabled="exporting"><i class="bi bi-file-zip me-1"></i>ZIP</button>
                    <button class="btn btn-outline-info btn-sm" @click="doExport('long_img')" :disabled="exporting"><i class="bi bi-image me-1"></i>长图</button>
                </div>
                <div x-show="msg" class="alert py-1 px-2 mt-2" :class="ok ? 'alert-success' : 'alert-danger'" x-text="msg"></div>
            </div>
        </div>

        <!-- 统计 -->
        <div class="jm-card">
            <div class="jm-card-header">
                <span class="jm-card-title"><i class="bi bi-bar-chart" style="color:var(--accent)"></i> 存储统计</span>
            </div>
            <div class="jm-card-body" id="storage-stats" hx-get="/files/browse" hx-trigger="load once"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function exportPanel(){
    return {
        exportPath:'', exporting:false, msg:'', ok:false,
        async doExport(fmt){
            if(!this.exportPath.trim()){this.msg='请输入路径';this.ok=false;return;}
            this.exporting=true; this.msg='';
            try{
                var r=await fetch('/files/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:this.exportPath.trim(),format:fmt})});
                var d=await r.json(); this.ok=r.ok; this.msg=d.message||d.error;
                if(r.ok) htmx.trigger('#file-tree','reload');
            }catch(e){this.ok=false;this.msg='请求失败: '+e.message;}
            finally{this.exporting=false;}
        }
    };
}
</script>
{% endblock %}
