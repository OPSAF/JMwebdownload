<!-- 文件预览 (HTMX partial) -->

<nav aria-label="breadcrumb" class="mb-2">
    <ol class="breadcrumb small">
        {% for crumb in breadcrumbs %}
        <li class="breadcrumb-item {{ 'active text-light' if loop.last else '' }}">
            {% if not loop.last %}
            <a href="#" class="text-info"
               hx-get="{{ url_for('files.browse', subpath=crumb.path) }}"
               hx-target="#file-tree" hx-swap="innerHTML">
                {{ crumb.name }}
            </a>
            {% else %}
            {{ crumb.name }}
            {% endif %}
        </li>
        {% endfor %}
    </ol>
</nav>

<div class="card bg-dark border-secondary">
    {% if file_type == 'image' %}
    <div class="card-body text-center p-2">
        <img src="{{ url_for('files.serve_file', filepath=filepath) }}"
             class="img-fluid rounded" style="max-height: 75vh"
             alt="{{ filename }}" loading="lazy">
    </div>
    <div class="card-footer d-flex justify-content-between">
        <small class="text-secondary">{{ filename }} · {{ size_human }}</small>
        <div>
            <a href="{{ url_for('files.serve_file', filepath=filepath) }}" target="_blank"
               class="btn btn-outline-info btn-sm">新窗口打开</a>
            <a href="{{ url_for('files.serve_file', filepath=filepath) }}" download
               class="btn btn-outline-light btn-sm"><i class="bi bi-download"></i> 下载</a>
        </div>
    </div>

    {% elif file_type == 'pdf' %}
    <div class="card-body p-0" style="height: 80vh">
        <iframe src="{{ url_for('files.serve_file', filepath=filepath) }}#toolbar=1&navpanes=1"
                width="100%" height="100%" class="rounded-bottom"></iframe>
    </div>

    {% else %}
    <div class="card-body text-center py-4 text-secondary">
        <i class="bi bi-file-earmark" style="font-size: 3rem"></i>
        <p class="mt-2">无法预览此文件类型</p>
        <a href="{{ url_for('files.serve_file', filepath=filepath) }}" download
           class="btn btn-outline-light btn-sm"><i class="bi bi-download"></i> 下载文件</a>
    </div>
    {% endif %}
</div>
