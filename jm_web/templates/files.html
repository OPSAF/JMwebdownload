{% extends "base.html" %}
{% block title %}文件浏览 — JM Downloader{% endblock %}
{% block page_class %}files{% endblock %}
{% block content %}

<div class="row">
    <!-- 文件树 -->
    <div class="col-lg-8">
        <div class="card bg-dark-subtle border-secondary">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-folder2-open text-primary"></i> 文件浏览器</h5>
                <button class="btn btn-sm btn-outline-info" onclick="htmx.trigger('#file-tree', 'reload')">
                    <i class="bi bi-arrow-clockwise"></i> 刷新
                </button>
            </div>
            <div class="card-body p-2">
                <div id="file-tree"
                     hx-get="/files/browse"
                     hx-trigger="load, reload from:body"
                     hx-swap="innerHTML">
                    <div class="text-center py-5 text-secondary">
                        <div class="spinner-border"></div>
                        <p class="mt-2">加载文件...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 侧栏：快捷操作 -->
    <div class="col-lg-4">
        <!-- 导出 -->
        <div class="card bg-dark-subtle border-secondary mb-3" x-data="exportPanel()">
            <div class="card-header">
                <h6 class="mb-0"><i class="bi bi-file-earmark-arrow-up text-warning"></i> 导出工具</h6>
            </div>
            <div class="card-body">
                <div class="mb-2">
                    <label class="form-label text-secondary">目标路径（相对于下载目录）</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary"
                           placeholder="例如: JM12345" x-model="exportPath">
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-danger btn-sm" @click="doExport('pdf')"
                            :disabled="exporting">
                        <i class="bi bi-file-pdf"></i> PDF
                    </button>
                    <button class="btn btn-outline-warning btn-sm" @click="doExport('zip')"
                            :disabled="exporting">
                        <i class="bi bi-file-zip"></i> ZIP
                    </button>
                    <button class="btn btn-outline-info btn-sm" @click="doExport('long_img')"
                            :disabled="exporting">
                        <i class="bi bi-image"></i> 长图
                    </button>
                </div>
                <div x-show="msg" class="mt-2 alert py-1" :class="ok ? 'alert-success' : 'alert-danger'" x-text="msg"></div>
            </div>
        </div>

        <!-- 统计 -->
        <div class="card bg-dark-subtle border-secondary">
            <div class="card-header">
                <h6 class="mb-0"><i class="bi bi-bar-chart text-info"></i> 存储统计</h6>
            </div>
            <div class="card-body" id="storage-stats"
                 hx-get="/files/browse" hx-trigger="load once">
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function exportPanel() {
    return {
        exportPath: '',
        exporting: false,
        msg: '',
        ok: false,

        async doExport(format) {
            if (!this.exportPath.trim()) {
                this.msg = '请输入路径';
                this.ok = false;
                return;
            }
            this.exporting = true;
            this.msg = '';
            try {
                const resp = await fetch('/files/api/export', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path: this.exportPath.trim(), format}),
                });
                const result = await resp.json();
                this.ok = resp.ok;
                this.msg = result.message || result.error;
                if (resp.ok) {
                    // 刷新文件列表
                    htmx.trigger('#file-tree', 'reload');
                }
            } catch (e) {
                this.ok = false;
                this.msg = `请求失败: ${e.message}`;
            } finally {
                this.exporting = false;
            }
        },
    };
}
</script>
{% endblock %}
