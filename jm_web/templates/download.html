{% extends "base.html" %}
{% block title %}下载管理 — JM Downloader{% endblock %}
{% block page_class %}download{% endblock %}
{% block content %}

<div x-data="downloadManager()" x-init="init()">
    <!-- 新建下载 -->
    <div class="card bg-dark-subtle border-secondary mb-3" x-data="{ showAdvanced: false }">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="bi bi-plus-circle text-success"></i> 新建下载任务</h5>
            <button class="btn btn-sm btn-outline-secondary" @click="showAdvanced = !showAdvanced">
                <i class="bi bi-sliders"></i> <span x-text="showAdvanced ? '收起' : '高级选项'"></span>
            </button>
        </div>
        <div class="card-body">
            <form @submit.prevent="submitDownload()">
                <div class="row g-2">
                    <div class="col-md-4">
                        <label class="form-label text-secondary">本子ID</label>
                        <input type="text" class="form-control bg-dark text-light border-secondary"
                               placeholder="输入 JM 本子ID" x-model="albumId" required
                               @paste="handlePaste($event)">
                        <small class="text-muted">支持从含ID的文本中自动提取</small>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-secondary">导出格式</label>
                        <div class="d-flex gap-2 pt-1">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" value="pdf" x-model="exportFormats">
                                <label class="form-check-label text-light">PDF</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" value="zip" x-model="exportFormats">
                                <label class="form-check-label text-light">ZIP</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" value="long_img" x-model="exportFormats">
                                <label class="form-check-label text-light">长图</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-secondary">图片格式</label>
                        <select class="form-select bg-dark text-light border-secondary" x-model="imageSuffix">
                            <option value="">默认</option>
                            <option value=".jpg">JPG</option>
                            <option value=".png">PNG</option>
                            <option value=".webp">WebP</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-secondary">并发数</label>
                        <input type="number" class="form-control bg-dark text-light border-secondary"
                               x-model="threadCount" placeholder="默认" min="1" max="50">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100" :disabled="submitting">
                            <span x-show="!submitting"><i class="bi bi-download"></i> 开始下载</span>
                            <span x-show="submitting" class="spinner-border spinner-border-sm"></span>
                        </button>
                    </div>
                </div>

                <!-- 高级选项 -->
                <div x-show="showAdvanced" x-collapse class="mt-3 pt-3 border-top border-secondary">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <label class="form-label text-secondary">登录用户名</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary"
                                   placeholder="敏感本子需登录" x-model="loginUsername">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-secondary">登录密码</label>
                            <input type="password" class="form-control bg-dark text-light border-secondary"
                                   placeholder="禁漫密码" x-model="loginPassword">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-secondary">代理</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary"
                                   placeholder="127.0.0.1:7890" x-model="proxy">
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 任务列表 (HTMX 轮询) -->
    <div id="task-list-container"
         hx-get="/download/partial/task-list"
         hx-trigger="every 2s"
         hx-swap="innerHTML">
        {% include "partials/task_list.html" %}
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function downloadManager() {
    return {
        albumId: '',
        exportFormats: [],
        imageSuffix: '',
        threadCount: null,
        loginUsername: '',
        loginPassword: '',
        proxy: '',
        submitting: false,

        init() {
            // 初始化 TaskManager（如果还没初始化）
            if (!window.TaskManager) {
                window.TaskManager = new TaskTracker();
            }
        },

        handlePaste(event) {
            // 从粘贴的文本中提取数字ID（如 "JM438696" 或链接）
            setTimeout(() => {
                const text = this.albumId;
                const match = text.match(/(\d{5,7})/);
                if (match && match[1] !== text) {
                    this.albumId = match[1];
                }
            }, 50);
        },

        async submitDownload() {
            if (!this.albumId.trim()) return;
            // 提取纯数字
            const match = this.albumId.trim().match(/\d{5,7}/);
            const pureId = match ? match[0] : this.albumId.trim();

            this.submitting = true;
            try {
                const resp = await fetch('/download/api/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        album_id: pureId,
                        image_suffix: this.imageSuffix || null,
                        thread_count: this.threadCount || null,
                        export_formats: this.exportFormats.length > 0 ? this.exportFormats : null,
                        login_username: this.loginUsername || null,
                        login_password: this.loginPassword || null,
                        proxy: this.proxy || null,
                    }),
                });
                const result = await resp.json();
                if (result.task_id) {
                    showToast('success', `任务已创建: ${result.task_id}`);
                    window.TaskManager.startTracking(result.task_id, pureId);
                    // 清空输入
                    this.albumId = '';
                    this.exportFormats = [];
                } else {
                    showToast('error', result.error || '创建失败');
                }
            } catch (e) {
                showToast('error', `请求失败: ${e.message}`);
            } finally {
                this.submitting = false;
            }
        },
    };
}
</script>
{% endblock %}
