<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JM Downloader{% endblock %}</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- htmx -->
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <!-- 自定义样式 -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    
    <!-- 看板娘样式（靠右） -->
    <link rel="stylesheet" href="https://unpkg.com/live2dapi-noa@latest/css/right.css" />

</head>
<body class="page-{% block page_class %}index{% endblock %}">

    <!-- ====== 顶栏导航（毛玻璃固定） ====== -->
    <nav class="navbar-jmd">
        <div class="container-fluid" style="max-width:1200px;padding:0 2rem;">
            <a class="navbar-brand-jmd" href="/">
                <i class="bi bi-journal-bookmark-fill brand-icon"></i>
                JM Downloader
            </a>

            <div class="d-flex align-items-center gap-2">
                <button class="navbar-toggler d-lg-none border-0" type="button"
                        data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"
                        style="color:var(--text-secondary)">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换明暗主题">
                    <i class="bi bi-sun icon-sun"></i>
                    <i class="bi bi-moon-stars icon-moon"></i>
                </button>
            </div>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link-jmd {{ 'active' if request.path == '/' }}"
                           href="/">
                            <i class="bi bi-house-door me-1"></i>首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link-jmd {{ 'active' if request.path.startswith('/browse') }}"
                           href="{{ url_for('search.index') }}">
                            <i class="bi bi-search me-1"></i>搜索浏览
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link-jmd {{ 'active' if request.path.startswith('/download') }}"
                           href="{{ url_for('download.index') }}">
                            <i class="bi bi-download me-1"></i>下载管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link-jmd {{ 'active' if request.path.startswith('/files') }}"
                           href="{{ url_for('files.index') }}">
                            <i class="bi bi-folder2-open me-1"></i>文件浏览
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link-jmd {{ 'active' if request.path.startswith('/favorites') }}"
                           href="{{ url_for('favorites.index') }}">
                            <i class="bi bi-heart me-1"></i>收藏夹
                        </a>
                    </li>
                    <li class="nav-item d-none d-lg-block">
                        <a class="nav-link-jmd {{ 'active' if request.path.startswith('/config') }}"
                           href="{{ url_for('config.index') }}">
                            <i class="bi bi-gear me-1"></i>配置
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link-jmd" href="https://github.com/OPSAF/JMwebdownload" target="_blank" rel="noopener noreferrer"
                           title="GitHub 项目">
                            <i class="bi bi-github"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Toast 通知容器 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    
    <!-- 看板娘脚本（顺序切换模型材质） -->
    <script src="https://unpkg.com/live2dapi-noa@latest/npm/sequential/autoload.js"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
