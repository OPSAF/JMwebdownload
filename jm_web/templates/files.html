{% extends "base.html" %}
{% block title %}文件浏览 — JM Downloader{% endblock %}
{% block page_class %}files{% endblock %}
{% block content %}

<div class="row">
    <!-- 左侧：文件树 -->
    <div class="col-lg-8">
        <div class="d-flex align-items-center gap-3 mb-3">
            <div style="width:4px;height:24px;border-radius:2px;background:linear-gradient(180deg,#f59e0b,#ef4444)"></div>
            <h2 class="mb-0" style="font-size:1.25rem;font-weight:700"><i class="bi bi-folder2-open text-warning me-1"></i>文件浏览器</h2>
            <button class="btn btn-sm btn-outline-info ms-auto" onclick="htmx.trigger('#file-tree','reload')">
                <i class="bi bi-arrow-clockwise me-1"></i>刷新
            </button>
        </div>
        <div class="card">
            <div class="card-body p-2">
                <div id="file-tree"
                     hx-get="/files/browse"
                     hx-trigger="load, reload from:body"
                     hx-swap="innerHTML">
                    <div class="text-center py-5">
                        <div class="spinner-border spinner-border-sm text-muted"></div>
                        <p class="mt-2 text-muted">加载文件...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧：工具栏 -->
    <div class="col-lg-4 mt-3 mt-lg-0">
        <!-- 导出 -->
        <div class="card mb-3" x-data="exportPanel()">
            <div class="card-header py-2 px-3">
                <span style="font-weight:600;font-size:.88rem"><i class="bi bi-file-earmark-arrow-up text-warning me-1"></i>导出工具</span>
            </div>
            <div class="card-body p-3">
                <div class="mb-2">
                    <label class="form-label text-muted text-xs">目标路径（相对于下载目录）</label>
                    <input type="text" class="form-control form-control-sm bg-dark-subtle"
                           placeholder="例如: JM12345" x-model="exportPath">
                </div>
                <div class="d-flex gap-1 flex-wrap">
                    <button class="btn btn-outline-danger btn-sm" @click="doExport('pdf')" :disabled="exporting">
                        <i class="bi bi-file-pdf me-1"></i>PDF
                    </button>
                    <button class="btn btn-outline-warning btn-sm" @click="doExport('zip')" :disabled="exporting">
                        <i class="bi bi-file-zip me-1"></i>ZIP
                    </button>
                    <button class="btn btn-outline-info btn-sm" @click="doExport('long_img')" :disabled="exporting">
                        <i class="bi bi-image me-1"></i>长图
                    </button>
                </div>
                <div x-show="msg" class="mt-2 alert py-1 px-2" :class="ok ? 'alert-success' : 'alert-danger'" x-text="msg"></div>
            </div>
        </div>

        <!-- 统计 -->
        <div class="card">
            <div class="card-header py-2 px-3">
                <span style="font-weight:600;font-size:.88rem"><i class="bi bi-bar-chart text-info me-1"></i>存储统计</span>
            </div>
            <div class="card-body p-3" id="storage-stats" hx-get="/files/browse" hx-trigger="load once"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function exportPanel() {
    return {
        exportPath: '', exporting: false, msg: '', ok: false,

        async doExport(fmt) {
            if (!this.exportPath.trim()) { this.msg = '请输入路径'; this.ok = false; return; }
            this.exporting = true; this.msg = '';
            try {
                var r = await fetch('/files/api/export', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path: this.exportPath.trim(), format: fmt})
                });
                var d = await r.json();
                this.ok = r.ok; this.msg = d.message || d.error;
                if (r.ok) htmx.trigger('#file-tree', 'reload');
            } catch (e) { this.ok = false; this.msg = '请求失败: ' + e.message; }
            finally { this.exporting = false; }
        }
    };
}
</script>
{% endblock %}
