{% extends "base.html" %}
{% block title %}搜索浏览 — JM Downloader{% endblock %}
{% block page_class %}browse{% endblock %}
{% block content %}

<div x-data="browseApp()" x-init="init()">
    <!-- 顶部控制区 -->
    <div class="card bg-dark-subtle border-secondary mb-3">
        <div class="card-body pb-2">
            <!-- Tab 切换 -->
            <ul class="nav nav-pills mb-3">
                <li class="nav-item">
                    <button class="nav-link" :class="mode === 'hot' ? 'active' : ''"
                            @click="switchMode('hot')">🔥 热门</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" :class="mode === 'rankings' ? 'active' : ''"
                            @click="switchMode('rankings')">📊 排行榜</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" :class="mode === 'search' ? 'active' : ''"
                            @click="switchMode('search')">🔍 搜索</button>
                </li>
            </ul>

            <!-- 热门模式工具栏 -->
            <div x-show="mode === 'hot'" class="d-flex align-items-center gap-2 flex-wrap">
                <span class="text-secondary text-sm">本周热门本子</span>
                <button class="btn btn-sm btn-outline-light" @click="page = 1; doHot()"
                        :disabled="loading">
                    <span x-show="!loading"><i class="bi bi-arrow-clockwise"></i> 刷新</span>
                    <span x-show="loading"><span class="spinner-border spinner-border-sm"></span></span>
                </button>
            </div>

            <!-- 排行榜模式工具栏 -->
            <div x-show="mode === 'rankings'" class="row g-2 align-items-end">
                <div class="col-auto">
                    <select class="form-select form-select-sm bg-dark text-light border-secondary"
                            style="min-width:110px" x-model="rankTime">
                        <option value="ALL">全部时间</option>
                        <option value="TODAY">今日</option>
                        <option value="WEEK" selected>本周</option>
                        <option value="MONTH">本月</option>
                    </select>
                </div>
                <div class="col-auto">
                    <select class="form-select form-select-sm bg-dark text-light border-secondary"
                            style="min-width:110px" x-model="rankOrder">
                        <option value="VIEW" selected>按观看</option>
                        <option value="LIKE">按点赞</option>
                        <option value="LATEST">按最新</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button class="btn btn-sm btn-outline-light" @click="page = 1; doRankings()"
                            :disabled="loading">
                        <span x-show="!loading"><i class="bi bi-arrow-clockwise"></i> 刷新</span>
                        <span x-show="loading"><span class="spinner-border spinner-border-sm"></span></span>
                    </button>
                </div>
            </div>

            <!-- 搜索模式工具栏 -->
            <div x-show="mode === 'search'" class="row g-2 align-items-end">
                <div class="col-md-6 col-lg-7">
                    <input type="text" class="form-control form-control-sm bg-dark text-light border-secondary"
                           placeholder="搜索关键字、标签、作者..." x-model="searchQuery"
                           @keyup.enter="page = 1; doSearch()">
                </div>
                <div class="col-auto">
                    <button class="btn btn-warning btn-sm" @click="page = 1; doSearch()"
                            :disabled="loading">
                        <span x-show="!loading"><i class="bi bi-search"></i> 搜索</span>
                        <span x-show="loading"><span class="spinner-border spinner-border-sm"></span></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 结果区域 (HTMX 加载) -->
    <div id="search-results-area"
         hx-get=""
         hx-trigger="load">
        <div class="text-center py-5 text-secondary">
            <div class="spinner-border"></div>
            <p class="mt-2">加载中...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function browseApp() {
    return {
        mode: 'hot',
        searchQuery: '',
        page: 1,
        rankTime: 'WEEK',
        rankOrder: 'VIEW',
        loading: false,

        init() {
            this.doHot();
        },

        switchMode(newMode) {
            if (this.mode === newMode) return;
            this.mode = newMode;
            this.page = 1;
            if (newMode === 'hot') this.doHot();
            else if (newMode === 'rankings') this.doRankings();
        },

        doHot() {
            this.loading = true;
            const area = document.getElementById('search-results-area');
            area.setAttribute('hx-get', `/browse/rankings?time=WEEK&category=CATEGORY_ALL&order_by=VIEW&page=${this.page}`);
            htmx.process(area);
            htmx.trigger(area, 'htmx-get');
            this.loading = false;
        },

        doRankings() {
            this.loading = true;
            const area = document.getElementById('search-results-area');
            area.setAttribute('hx-get',
                `/browse/rankings?time=${this.rankTime}&category=CATEGORY_ALL&order_by=${this.rankOrder}&page=${this.page}`);
            htmx.process(area);
            htmx.trigger(area, 'htmx-get');
            this.loading = false;
        },

        doSearch() {
            this.loading = true;
            const area = document.getElementById('search-results-area');
            const q = encodeURIComponent(this.searchQuery || '');
            area.setAttribute('hx-get', `/browse/search-results?q=${q}&page=${this.page}`);
            htmx.process(area);
            htmx.trigger(area, 'htmx-get');
            this.loading = false;
        },
    };
}
</script>
{% endblock %}
